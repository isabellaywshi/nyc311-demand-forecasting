[project]
name = "nyc311"
version = "0.1.0"
description = "Weekly NYC 311 service-request demand forecasting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "requests",
    "statsforecast",
    "lightgbm",
    "shap",
    "mlflow",
    "holidays",
    "pyyaml",
    "typer",
    "streamlit",
    "plotly",
    "geopandas",
]

[project.scripts]
nyc311 = "nyc311.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "nbformat",
    "ipykernel",
    "nbconvert>=7.17.2",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc311"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

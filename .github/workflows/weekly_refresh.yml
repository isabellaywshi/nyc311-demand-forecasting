name: Weekly refresh

on:
  schedule:
    # Tuesdays 18:00 UTC. The dataset loads with ~1-day lag, so by Tuesday afternoon
    # Monday's records exist and the prior Mon-Sun week counts as complete.
    - cron: "0 18 * * 2"
  workflow_dispatch:

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Unique key per run => always saves a new cache; restore-keys picks
      # up the most recent previous one, so only recent months are re-fetched.
      - uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: |
            raw-
      - name: Refresh data and forecasts
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: uv run --frozen nyc311 refresh
      # Save even if refresh failed or timed out, so partial downloads persist.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
      - name: Commit refreshed app data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/data
          if git diff --cached --quiet -- app/data; then
            echo "no changes"
          else
            git commit -m "data: weekly refresh $(date +%F)"
            git pull --rebase
            git push
          fi

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest -q
